<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17131d">
  <meta name="description" content="AWAC 1기 1주차 강의덱">
  <title>AWAC 1기 1주차 강의덱</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317131d'/%3E%3Cpath d='M14 45 25 17h9l5 13 5-13h7L39 47h-8l-5-14-5 14z' fill='%23ff573c'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #17131d;
      --text: #f7f6f2;
      --muted: #b9b2c4;
      --accent: #ff573c;
      --line: rgba(255, 255, 255, 0.16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--ink);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
    }

    .page {
      display: grid;
      grid-template-rows: auto 1fr;
      height: 100%;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      min-height: 70px;
      padding: 12px 22px;
      border-bottom: 1px solid var(--line);
    }

    .title-wrap {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
    }

    .week {
      flex: 0 0 auto;
      padding: 8px 11px;
      color: var(--ink);
      background: var(--accent);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 900;
    }

    h1 {
      margin: 0;
      overflow: hidden;
      font-size: 18px;
      line-height: 1.25;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex: 0 0 auto;
      gap: 8px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      min-height: 42px;
      padding: 0 15px;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 800;
      text-decoration: none;
    }

    .button.primary {
      color: var(--ink);
      border-color: var(--accent);
      background: var(--accent);
    }

    .viewer {
      width: 100%;
      height: 100%;
      border: 0;
      background: #f3f1ee;
    }

    .fallback {
      display: grid;
      place-items: center;
      height: 100%;
      padding: 28px;
      text-align: center;
    }

    .fallback p {
      max-width: 560px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    @media (max-width: 640px) {
      header { padding: 10px 12px; }
      h1 { font-size: 15px; }
      .button:not(.primary) { display: none; }
      .button { min-height: 40px; padding: 0 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div class="title-wrap">
        <span class="week">WEEK 01</span>
        <h1>AWAC 1기 1주차 강의덱</h1>
      </div>
      <nav class="actions" aria-label="강의덱 작업">
        <a class="button" href="https://leeyoojinwork-pm.github.io/awac-cohort1-platform/">전체 주차</a>
        <a class="button primary" href="AWAC-week1-deck.pdf" target="_blank" rel="noopener">PDF 새 창</a>
      </nav>
    </header>

    <object class="viewer" data="AWAC-week1-deck.pdf#view=FitH" type="application/pdf">
      <div class="fallback">
        <p>이 브라우저에서는 PDF를 화면 안에 표시할 수 없습니다. 위의 PDF 새 창 버튼으로 강의덱을 열어주세요.</p>
      </div>
    </object>
  </main>
</body>
</html>
